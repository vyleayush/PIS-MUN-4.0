services:
  - type: web
    name: paramount-mun-api
    runtime: node
    region: singapore  # closest to India
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: ADMIN_EMAIL
        value: paramountinternationalmun.26@gmail.com
      - key: ADMIN_PASSWORD
        sync: false  # set manually in Render dashboard
      - key: ORGANIZER_EMAIL
        value: paramountinternationalmun.26@gmail.com
      - key: FRONTEND_URL
        value: https://paramountmun.in
      - key: GMAIL_USER
        value: paramountinternationalmun.26@gmail.com
      - key: GMAIL_APP_PASSWORD
        sync: false  # set manually in Render dashboard (16-char app password from Google)
      - key: EMAIL_RELAY_URL
        sync: false  # Google Apps Script Web App URL for HTTPS email relay (bypasses Render SMTP blocking)
      - key: EMAIL_RELAY_SECRET
        sync: false  # Shared secret matching RELAY_SECRET in email_relay.gs
      - key: TURSO_DATABASE_URL
        sync: false  # Turso Cloud DB connection URL
      - key: TURSO_AUTH_TOKEN
        sync: false  # Turso Cloud Auth Token
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /opt/render/project/data
    disk:
      name: mun-data
      mountPath: /opt/render/project/data
      sizeGB: 1
